<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BELAK — Links</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root{
      --bg1: #071022; /* dark */
      --bg2: #0b1020;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
      --accent-a: #7c3aed; /* purple */
      --accent-b: #06b6d4; /* teal */
      --white: #eaf2ff;
      --muted: #9aa6bb;
      --maxw: 420px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,58,237,0.12), transparent),
                  radial-gradient(900px 400px at 90% 90%, rgba(6,182,212,0.06), transparent),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--white);
      -webkit-font-smoothing:antialiased;
      display:flex;align-items:center;justify-content:center;padding:24px;
    }

    .card{
      width:100%;max-width:var(--maxw);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:18px;padding:34px;border:1px solid rgba(255,255,255,0.06);
      box-shadow:0 10px 30px rgba(2,6,23,0.6);text-align:center;
    }

    .avatar-wrap{position:relative;display:flex;justify-content:center}
    .avatar{
      width:120px;height:120px;border-radius:999px;object-fit:cover;border:4px solid rgba(255,255,255,0.06);
      box-shadow:0 10px 30px rgba(0,0,0,0.6), 0 0 30px rgba(124,58,237,0.08);
    }

    .name{font-family:Orbitron, Inter, sans-serif;font-weight:700;margin-top:16px;font-size:1.4rem;letter-spacing:2px}
    .role{color:var(--muted);font-size:0.95rem;margin-top:6px;margin-bottom:20px}

    .links{
      display:flex;flex-direction:column;gap:12px;margin-top:8px;
    }

    .btn{
      display:inline-flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;text-decoration:none;color:var(--white);
      background:linear-gradient(90deg,var(--accent-a),var(--accent-b));font-weight:600;justify-content:center;box-shadow:0 8px 20px rgba(7,10,25,0.6);
      transition:transform .18s ease,box-shadow .18s ease,opacity .12s ease;position:relative;overflow:hidden;
    }

    .btn .fa-brands{font-size:1.1rem}

    .btn:hover{transform:translateY(-4px);box-shadow:0 18px 30px rgba(6,182,212,0.12)}

    .btn.secondary{
      background:linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));color:var(--white);border:1px solid rgba(255,255,255,0.06);
    }

    .btn.ghost{background:transparent;border:1px dashed rgba(255,255,255,0.06);color:var(--muted);font-weight:600}

    .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
    .username{color:var(--muted);font-size:0.9rem}

    footer{margin-top:18px;color:rgba(255,255,255,0.35);font-size:0.85rem}

    /* Colored brand accents per network */
    .tiktok{--brand:#ff0050}
    .youtube{--brand:#ff0000}
    .discord{--brand:#7289da}
    .instagram{--brand:#e1306c}

    .brand-accent{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}

    /* Responsive */
    @media (max-width:420px){.card{padding:24px}.btn{padding:12px;font-size:0.96rem}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="avatar-wrap">
      <!-- If you have a profile image, place it at /Profile.jpeg or update the src -->
      <img src="Profile.jpeg" alt="Belak profile" class="avatar" onerror="this.src='https://via.placeholder.com/120x120.png?text=B'">
    </div>

    <h1 class="name">BELAK</h1>
    <div class="role">Competitive Gamer • Content Creator</div>

    <div class="links" aria-label="Links">
      <a class="btn tiktok" href="https://www.tiktok.com/@belakxx" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-tiktok"></i>
        TikTok
        <span class="brand-accent" style="background:var(--brand)"></span>
      </a>

      <a class="btn youtube" href="https://www.youtube.com/@Belakplays" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-youtube"></i>
        YouTube
        <span class="brand-accent" style="background:var(--brand)"></span>
      </a>

      <a class="btn discord secondary" href="https://discord.gg/jCfg2hex" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-discord"></i>
        Join Discord
n        <span class="brand-accent" style="background:var(--brand)"></span>
      </a>

      <a class="btn instagram" href="https://www.instagram.com/belakxx" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-instagram"></i>
        Instagram
        <span class="brand-accent" style="background:var(--brand)"></span>
      </a>

      <!-- Copy profile link button -->
      <button class="btn ghost" id="copyBtn" title="Copy profile URL">
        <i class="fa-regular fa-link"></i>
        Copy Profile Link
      </button>
    </div>

    <div class="meta-row">
      <div class="username">@belakxx</div>
      <div class="status">Online</div>
    </div>

    <footer>Made with ♥ — BELAKXX • 2026</footer>
  </main>

  <script>
    // Copy profile URL to clipboard
    document.getElementById('copyBtn').addEventListener('click', async function(){
      const url = window.location.href;
      try{
        await navigator.clipboard.writeText(url);
        this.textContent = 'Link copied ✓';
        setTimeout(()=>{this.innerHTML = '<i class="fa-regular fa-link"></i> Copy Profile Link'},2000);
      }catch(e){
        alert('Copy failed — open this page and copy the URL manually.');
      }
    });
  </script>
</body>
</html>
